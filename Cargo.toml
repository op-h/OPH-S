[workspace]
resolver = "2"
members = ["crates/oph-proto", "crates/oph-agent", "app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["OPH"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "io-util", "sync", "macros", "fs", "process"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
sha2 = "0.10"
netstat2 = "0.11"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
